id = "hunk.diff"
name = "Hunk Diff"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Open Hunk diffs from Herdr in a split pane or tab."
platforms = ["windows", "linux", "macos"]

# herdr はアクション id の重複を OS に関係なく拒否するため、同じ動作でも
# Unix 系（python3）と Windows（python）で別々の id を持たせている。
# Windows の python3 はシェルスクリプトのラッパーで CreateProcessW から起動できない。

[[actions]]
id = "worktree-split"
platforms = ["linux", "macos"]
title = "Hunk worktree diff in split"
contexts = ["pane", "workspace"]
command = ["python3", "hunk_herdr.py", "worktree", "split"]

[[actions]]
id = "worktree-split-windows"
platforms = ["windows"]
title = "Hunk worktree diff in split"
contexts = ["pane", "workspace"]
command = ["python", "hunk_herdr.py", "worktree", "split"]

[[actions]]
id = "worktree-tab"
platforms = ["linux", "macos"]
title = "Hunk worktree diff in tab"
contexts = ["pane", "workspace"]
command = ["python3", "hunk_herdr.py", "worktree", "tab"]

